name: Sync rule providers
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download current upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url; do
            [[ -z "${path}" || "${path:0:1}" == "#" ]] && continue
            mkdir -p "$(dirname "${path}")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors "${url}" --output "${path}"
          done < rules/sources.tsv
      - name: Strip Google and AI entries from non-matching classical rule files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          removals = {
              "rules/classical/global-media.yaml": {
                  "  - DOMAIN-KEYWORD,anthropic",
                  "  - DOMAIN-KEYWORD,claude",
                  "  - DOMAIN-KEYWORD,youtube",
                  "  - IP-CIDR,172.110.32.0/21",
                  "  - IP-CIDR,216.73.80.0/20",
                  "  - IP-CIDR6,2620:120:e000::/40",
              },
              "rules/classical/scholar.yaml": {
                  "  - DOMAIN,scholar.google.com",
              },
              "rules/classical/proxy.yaml": {
                  "  - DOMAIN-KEYWORD,1e100",
                  "  - DOMAIN-KEYWORD,blogspot",
                  "  - DOMAIN-KEYWORD,gmail",
                  "  - DOMAIN-KEYWORD,google",
                  "  - DOMAIN-KEYWORD,youtube",
                  "  - IP-CIDR,74.125.0.0/16",
                  "  - IP-CIDR,173.194.0.0/16",
                  "  - IP-CIDR,203.208.39.0/24",
                  "  - IP-CIDR,203.208.40.0/23",
                  "  - IP-CIDR,203.208.43.0/24",
                  "  - IP-CIDR,203.208.50.0/24",
              },
          }

          for rel, blocked in removals.items():
              p = Path(rel)
              if not p.exists():
                  continue
              lines = p.read_text(encoding="utf-8").splitlines()
              filtered = [line for line in lines if line not in blocked]
              p.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          PY
      - name: Build Surge rule-sets from rules/surge/self.list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          surge_dir = Path("rules/surge")
          self_list = surge_dir / "self.list"
          if not self_list.exists():
              raise SystemExit("rules/surge/self.list not found")

          policy_to_file = {
              "广告地址": "self-ads.list",
              "DIRECT": "self-direct.list",
              "meta": "self-meta.list",
              "Google": "self-google.list",
              "ChatGpt": "self-ai.list",
              "WECHAT": "self-wechat.list",
              "EmbyTV": "self-emby.list",
              "国内视频": "self-domestic-media.list",
              "苹果服务": "self-apple.list",
              "学术": "self-scholar.list",
              "其他地址": "self-other.list",
              "代理选择": "self-proxy.list",
              "国内地址": "self-domestic.list",
          }

          buckets = {fname: [] for fname in policy_to_file.values()}
          for lineno, raw in enumerate(self_list.read_text(encoding="utf-8").splitlines(), 1):
              s = raw.strip()
              if not s or s.startswith("#"):
                  continue
              parts = [p.strip() for p in s.split(",")]
              if len(parts) < 3:
                  raise ValueError(f"Invalid line {lineno}: {s}")
              rtype, val, policy, *opts = parts
              if policy not in policy_to_file:
                  raise ValueError(f"Unknown policy '{policy}' at line {lineno}")
              payload = ",".join([rtype, val, *opts])
              fname = policy_to_file[policy]
              if payload not in buckets[fname]:
                  buckets[fname].append(payload)

          for fname, entries in buckets.items():
              header = "# Auto-generated from rules/surge/self.list — do not edit directly\n"
              content = header + ("\n".join(entries) + "\n" if entries else "")
              (surge_dir / fname).write_bytes(content.encode("utf-8"))
          PY
      - name: Commit updated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "All rule snapshots are already current."
          else
            git commit -m "Sync upstream rule providers"
            git push
          fi
