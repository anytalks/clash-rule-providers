name: Sync rule providers
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download current upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url; do
            [[ -z "${path}" || "${path:0:1}" == "#" ]] && continue
            mkdir -p "$(dirname "${path}")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors "${url}" --output "${path}"
          done < rules/sources.tsv
      - name: Commit updated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "All rule snapshots are already current."
          else
            git commit -m "Sync upstream rule providers"
            git push
          fi
