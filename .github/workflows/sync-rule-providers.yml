name: Sync rule providers
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download current upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url; do
            [[ -z "${path}" || "${path:0:1}" == "#" ]] && continue
            mkdir -p "$(dirname "${path}")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors "${url}" --output "${path}"
          done < rules/sources.tsv
      - name: Strip Google and AI entries from non-matching classical rule files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          removals = {
              "rules/classical/global-media.yaml": {
                  "  - DOMAIN-KEYWORD,anthropic",
                  "  - DOMAIN-KEYWORD,claude",
                  "  - DOMAIN-KEYWORD,youtube",
                  "  - IP-CIDR,172.110.32.0/21",
                  "  - IP-CIDR,216.73.80.0/20",
                  "  - IP-CIDR6,2620:120:e000::/40",
              },
              "rules/classical/scholar.yaml": {
                  "  - DOMAIN,scholar.google.com",
              },
              "rules/classical/proxy.yaml": {
                  "  - DOMAIN-KEYWORD,1e100",
                  "  - DOMAIN-KEYWORD,blogspot",
                  "  - DOMAIN-KEYWORD,gmail",
                  "  - DOMAIN-KEYWORD,google",
                  "  - DOMAIN-KEYWORD,youtube",
                  "  - IP-CIDR,74.125.0.0/16",
                  "  - IP-CIDR,173.194.0.0/16",
                  "  - IP-CIDR,203.208.39.0/24",
                  "  - IP-CIDR,203.208.40.0/23",
                  "  - IP-CIDR,203.208.43.0/24",
                  "  - IP-CIDR,203.208.50.0/24",
              },
          }

          for rel, blocked in removals.items():
              p = Path(rel)
              if not p.exists():
                  continue
              lines = p.read_text(encoding="utf-8").splitlines()
              filtered = [line for line in lines if line not in blocked]
              p.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          PY
      - name: Commit updated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "All rule snapshots are already current."
          else
            git commit -m "Sync upstream rule providers"
            git push
          fi
